*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surface);

.tip .r{display:flex;justify-content:space-between;gap:18px}
.tip .r span:last-child{font-variant-numeric:tabular-nums}
.tip .hd{color:var(--ink-3);margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const cs=()=>getComputedStyle(document.documentElement);
const col=a=>cs().getPropertyValue(a.family==="sac"?"--sac":"--td3").trim();
const W=980,H=500,M={t:18,r:104,b:52,l:66};
let lo=Infinity,hi=-Infinity;
DATA.arms.forEach(a=>a.h.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)}));
lo=Math.floor(lo)-.5; hi=Math.ceil(hi)+.5;
const NS="http://www.w3.org/2000/svg";
const el=(n,at)=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);return e;};

function drawPanel(host,arms){
  host.innerHTML="";
  // scales are LOCAL to the panel: the irregular panels run to 1M and the
  // uniform ones to 400k, and a shared mutable X1 would leave every hover
  // handler reading whichever panel drew last.
  const x1=Math.max(...arms.map(a=>a.xmax));
  const sx=v=>M.l+v/x1*(W-M.l-M.r);
  const sy=v=>M.t+(hi-v)/(hi-lo)*(H-M.t-M.b);
  const ticks=x1>500000?[0,250000,500000,750000,1000000]:[0,100000,200000,300000,400000];
  const line=(st,vs)=>{let d="",pen=false;
    for(let i=0;i<st.length;i++){const v=vs[i]; if(v==null){pen=false;continue;}
      d+=(pen?"L":"M")+sx(st[i]).toFixed(1)+" "+sy(v).toFixed(1)+" "; pen=true;} return d.trim();};

  const wrap=document.createElement("div"); wrap.className="chart";
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img",
    "aria-label":"Termination-charged reward rate against training steps"});
  const ink2=cs().getPropertyValue("--ink-2").trim();
  const ink3=cs().getPropertyValue("--ink-3").trim();
  const grid=cs().getPropertyValue("--grid").trim();
  const band=cs().getPropertyValue("--band").trim();
  const surf=cs().getPropertyValue("--surface").trim();
  if(lo<0) svg.appendChild(el("rect",{x:M.l,y:sy(0),width:W-M.l-M.r,
    height:Math.max(0,sy(lo)-sy(0)),fill:band}));
  for(let v=Math.ceil(lo/2)*2;v<=hi;v+=2){
    svg.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:sy(v),y2:sy(v),
      stroke:v===0?ink3:grid,"stroke-width":1,"stroke-dasharray":v===0?"4 4":""}));
    const t=el("text",{x:M.l-12,y:sy(v)+4.5,"text-anchor":"end",fill:ink3,
      "font-family":"var(--mono)","font-size":"12.5"}); t.textContent=v; svg.appendChild(t);}
  ticks.forEach(v=>{const t=el("text",{x:sx(v),y:H-M.b+22,"text-anchor":"middle",fill:ink3,
      "font-family":"var(--mono)","font-size":"12.5"});
    t.textContent=v?v/1000+"k":"0"; svg.appendChild(t);});
  svg.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:H-M.b,y2:H-M.b,stroke:grid}));
  const xl=el("text",{x:(M.l+W-M.r)/2,y:H-M.b+42,"text-anchor":"middle",fill:ink2,
    "font-family":"var(--mono)","font-size":"12"}); xl.textContent="training steps";
  svg.appendChild(xl);
  const yl=el("text",{x:0,y:0,"text-anchor":"middle",fill:ink2,"font-family":"var(--mono)",
    "font-size":"12",transform:`translate(16,${(M.t+H-M.b)/2}) rotate(-90)`});
  yl.textContent="termination-charged reward rate"; svg.appendChild(yl);

  arms.forEach(a=>{const k=col(a);
    svg.appendChild(el("path",{d:line(a.steps,a.h),fill:"none",stroke:k,"stroke-width":2.6,
      "stroke-linejoin":"round","stroke-linecap":"round","stroke-dasharray":a.ct?"":"8 5"}));
    const li=a.h.length-1;
    svg.appendChild(el("circle",{cx:sx(a.steps[li]),cy:sy(a.h[li]),r:3.8,fill:k,
      stroke:surf,"stroke-width":1.8}));
    const lab=el("text",{x:sx(a.steps[li])+10,y:sy(a.h[li])+4.2,fill:k,
      "font-family":"var(--mono)","font-size":"12.5","font-weight":"500"});
    lab.textContent=a.label; svg.appendChild(lab);});

  const cross=el("line",{y1:M.t,y2:H-M.b,stroke:ink3,"stroke-width":1,opacity:0});
  svg.appendChild(cross); wrap.appendChild(svg);
  const tip=document.createElement("div"); tip.className="tip"; wrap.appendChild(tip);
  svg.addEventListener("pointermove",ev=>{
    const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W;
    if(px<M.l||px>W-M.r){cross.setAttribute("opacity",0);tip.style.opacity=0;return;}
    const step=(px-M.l)/(W-M.l-M.r)*x1;
    let rows="",shown=0,at=null;
    arms.forEach(a=>{
      if(step<a.steps[0]-1e-9) return;                 // arm has no data this early
      let j=0,jd=Infinity;
      a.steps.forEach((s,i)=>{const d=Math.abs(s-step); if(d<jd){jd=d;j=i}});
      if(at===null) at=a.steps[j];
      const dd=a.dead[j]>0?`  ${(a.dead[j]*100).toFixed(0)}% dead`:"";
      rows+=`<div class="r"><span style="color:${col(a)}">${a.label}</span>`+
            `<span>${a.h[j].toFixed(2)}${a.c[j]>0?"  cap "+(a.c[j]*100).toFixed(0)+"%":""}${dd}</span></div>`;
      shown++;});
    if(!shown){cross.setAttribute("opacity",0);tip.style.opacity=0;return;}
    cross.setAttribute("x1",sx(at)); cross.setAttribute("x2",sx(at)); cross.setAttribute("opacity",.4);
    tip.innerHTML=`<div class="hd">${Math.round(at/1000)}k steps</div>`+rows;
    tip.style.opacity=1;
    const lx=sx(at)/W*r.width;
    tip.style.left=Math.min(r.width-tip.offsetWidth-8,Math.max(0,lx+14))+"px";
    tip.style.top="10px";});
  svg.addEventListener("pointerleave",()=>{cross.setAttribute("opacity",0);tip.style.opacity=0;});
  host.appendChild(wrap);
}
function render(){
  ["baseline","demo","ibaseline","idemo"].forEach(k=>{
    const arms=DATA.arms.filter(a=>a.panel===k);
    if(arms.length) drawPanel(document.getElementById("p-"+k),arms);});
  document.getElementById("legend").innerHTML=`
   <span class="lg"><svg width="28" height="10"><line x1="1" y1="5" x2="27" y2="5" style="stroke:var(--sac)" stroke-width="2.6"/></svg>SAC family</span>
   <span class="lg"><svg width="28" height="10"><line x1="1" y1="5" x2="27" y2="5" style="stroke:var(--td3)" stroke-width="2.6"/></svg>TD3 family</span>
   <span class="lg"><svg width="28" height="10"><line x1="1" y1="5" x2="27" y2="5" style="stroke:var(--ink-3)" stroke-width="2.6"/></svg>solid = continuous-time</span>
   <span class="lg"><svg width="28" height="10"><line x1="1" y1="5" x2="27" y2="5" style="stroke:var(--ink-3)" stroke-width="2.6" stroke-dasharray="8 5"/></svg>dashed = discrete</span>
   <span class="lg" style="color:var(--ink-3)">median of 6 seeds</span>`;
}
render();
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
</script>
